<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routines</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      background: var(--hub-bg, #f6f7f9);
      color: var(--hub-text, #000000);
      min-height: 100vh;
    }
    .app { max-width: 980px; margin: 0 auto; padding: 20px 16px 32px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
    h1 { font-size: 1.45rem; line-height: 1.2; }
    .muted { color: var(--hub-text-muted, #6b7280); font-size: .88rem; }
    .tabs { display: flex; gap: 4px; padding: 4px; background: var(--hub-border, #e5e7eb); border-radius: 10px; margin-bottom: 16px; overflow-x: auto; }
    .tab { border: 0; background: transparent; color: var(--hub-text-muted, #6b7280); border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--hub-surface, #fff); color: var(--hub-text, #000000); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    button, .btn {
      border: 1px solid var(--hub-border, #d1d5db);
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #000000);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: .88rem;
      cursor: pointer;
    }
    .primary { background: var(--hub-primary, #111827); color: var(--hub-primary-fg, #fff); border-color: var(--hub-primary, #111827); }
    .danger { color: #b91c1c; border-color: #fecaca; }
    .ghost { background: transparent; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .card { background: var(--hub-surface, #fff); border: 1px solid var(--hub-border, #e5e7eb); border-radius: 8px; padding: 14px; }
    .card h2, .card h3 { font-size: 1rem; margin-bottom: 4px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: .74rem; font-weight: 800; background: var(--hub-tint-info, #eef2ff); color: var(--hub-tint-info-fg, #3730a3); text-transform: capitalize; }
    .badge.done { background: var(--hub-tint-success, #dcfce7); color: var(--hub-tint-success-fg, #166534); }
    .badge.skipped { background: var(--hub-bg, #f3f4f6); color: var(--hub-text-muted, #4b5563); }
    .badge.active { background: var(--hub-tint-info, #dbeafe); color: var(--hub-tint-info-fg, #1d4ed8); }
    .badge.completed { background: var(--hub-tint-success, #dcfce7); color: var(--hub-tint-success-fg, #166534); }
    .badge.canceled { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #991b1b); }
    .steps { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .step { border: 1px solid var(--hub-border, #e5e7eb); border-radius: 8px; padding: 10px; background: var(--hub-bg, #f9fafb); }
    .step-title { font-weight: 800; }
    .step.done .step-title { text-decoration: line-through; color: #166534; }
    .step.skipped .step-title { text-decoration: line-through; color: var(--hub-text-muted, #6b7280); }
    .step-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .progress { height: 8px; background: var(--hub-border, #e5e7eb); border-radius: 999px; overflow: hidden; margin-top: 10px; }
    .progress span { display: block; height: 100%; background: #16a34a; width: var(--pct, 0%); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--hub-border, #d1d5db);
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #000000);
    }
    textarea { min-height: 82px; resize: vertical; }
    label { display: block; font-weight: 800; font-size: .78rem; color: var(--hub-text-muted, #4b5563); margin-bottom: 5px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .field { margin-bottom: 10px; }
    .step-editor { display: grid; grid-template-columns: 48px 1.4fr 1.8fr 84px 84px 1fr 74px 42px; gap: 8px; align-items: center; margin-bottom: 8px; }
    .step-editor input[type="checkbox"] { width: auto; }
    .step-icon { font-size: 1.3rem; line-height: 1; padding: 6px 0; text-align: center; }
    .step-emoji { font-size: 1.1rem; }
    .icon-picker { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border: 1px solid var(--hub-border, #e5e7eb); border-radius: 8px; background: var(--hub-bg, #f9fafb); }
    .icon-picker button { font-size: 1.2rem; padding: 4px 7px; line-height: 1; }
    .icon-picker .icon-clear { font-size: .78rem; }
    .empty { padding: 24px; text-align: center; color: var(--hub-text-muted, #6b7280); border: 1px dashed var(--hub-border, #d1d5db); border-radius: 8px; background: var(--hub-surface, #fff); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--hub-surface, #fff); border-radius: 10px; width: min(760px, 100%); max-height: 92vh; overflow: auto; padding: 18px; }
    .modal h2 { margin-bottom: 12px; font-size: 1.15rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .packet { background: var(--hub-surface, white); color: var(--hub-text, #111827); border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; }
    .packet h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .packet ol { padding-left: 22px; margin-top: 10px; }
    .packet li { margin-bottom: 10px; }
    @media (max-width: 720px) {
      header { flex-direction: column; }
      .step-editor { grid-template-columns: 48px 1fr; }
      .step-editor input, .step-editor select, .step-editor > label { grid-column: 2; }
      .row { align-items: flex-start; flex-direction: column; }
    }
    @media print {
      body * { visibility: hidden; }
      .printable, .printable * { visibility: visible; }
      .printable { position: absolute; inset: 0; padding: 0; }
      .no-print { display: none !important; }
    }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
</head>
<body>
  <div id="app" class="app"><p class="muted">Loading routines...</p></div>

  <script type="module">
    import {
      esc, initial, memberColor, isAdult, hubAlert, hubConfirm, searchMatch, hubToday,
      createShareHelper, activeShareLinks, SHARE_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS, glyph,
    } from "/hub-sdk.js";
    import { createShareUi, createOverlayView } from "./share.js";
    import { STARTER_TEMPLATES, ROUTINE_ICONS, normalizeIcon, completionSummary, canCompleteStep, sortByOrder, visibleTemplates, searchableFields, templateSaveStatements, templateCreatePlan, packetSaveStatements, MAX_BATCH_STATEMENTS, MAX_ROUTINE_STEPS, isRunSupervisor, canArchiveTemplate, canEditTemplate, buildRun, runDisplay, mayPublishRun, showRunTo, staleRuns, staleRunClosures, visibilityChoices, ACTIVE_RUNS_SHOWN } from "./logic.js";

    const CONTEXT = window.__CONTEXT_URL ?? "";
    const DB = window.__DB_URL ?? "";
    const APP_ID = window.__APP_ID ?? "routines";
    const ME = window.__CURRENT_MEMBER ?? null;
    const EVENTS_URL = window.__EVENTS_URL ?? "";

    // Neutralize DB-derived ids before interpolating into inline on* handlers:
    // HTML escaping does not protect a JS-string context inside an attribute, and
    // a member can write an attacker-chosen id via raw /api/db. Legit ids are
    // UUIDs, so restricting to [A-Za-z0-9_-] is lossless and injection-proof.
    const sid = v => String(v ?? "").replace(/[^A-Za-z0-9_-]/g, "");

    // External share links (manifest.shareable.packet). A caregiver packet is
    // already the "only what a caregiver should see" copy of a routine, so it is
    // the one thing this app shares: a babysitter can open the link on their
    // phone instead of being handed a printout. The hub injects these URLs only
    // when the manifest declares `shareable`, and mints for adults only.
    const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
    const shareView = createOverlayView(document);
    const shareUi = createShareUi({
      share,
      itemType: "packet",
      noun: "packet",
      scopeHtml: () => "The page shows the packet’s title, its notes and its steps as they were when the packet was made. Edits to the routine since then are not included. Contacts, health notes and documents are never on the page: send those separately.",
      esc,
      glyph,
      confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
      writeText: (text) => navigator.clipboard.writeText(text),
      activeLinks: activeShareLinks,
      expiryChoices: SHARE_EXPIRY_CHOICES,
      defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
      getMe: () => ME,
      isAdmin: () => window.__IS_ADMIN === true,
      memberName: (id) => memberMap.get(id)?.name ?? "",
      view: shareView,
    });
    shareView.bind(shareUi);

    let members = [];
    let memberMap = new Map();
    let templates = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)
    let templateSteps = [];
    let runs = [];
    let runSteps = [];
    let packets = [];
    let packetSteps = [];
    let tab = "today";
    let modalEl = null;
    let loadFailed = false; // first load failed; cleared when a load succeeds
    let stepsError = false;   // the active runs' steps could not be read; the runs themselves did load

    const demoAdult = { id: "demo-adult", name: "Morgan", role: "adult" };
    const demoChild = { id: "demo-child", name: "Avery", role: "child" };
    const currentMember = () => ME ?? demoAdult;
    const userIsAdult = () => !ME || isAdult(currentMember(), members);
    // Starting a run and ticking anyone's step follow run_steps' supervision
    // reach, which in a shared space is the admin, not every adult. See
    // isRunSupervisor in logic.js.
    const userSupervisesRuns = () => !ME || isRunSupervisor({ tenantKind: window.__TENANT_KIND ?? "household", isAdmin: window.__IS_ADMIN === true, adult: userIsAdult() });

    // Editing and archiving a template are for its owner and for whoever
    // supervises; a co-parenting space has no supervisor over template steps.
    // See canEditTemplate and canArchiveTemplate in logic.js.
    const tenant = () => ({ tenantKind: window.__TENANT_KIND ?? "household", spaceKind: window.__SPACE_KIND ?? null, isAdmin: window.__IS_ADMIN === true, adult: userIsAdult() });
    const userCanEditTemplate = (template) => !ME || canEditTemplate(template, currentMember(), tenant());
    const userCanArchiveTemplate = (template) => !ME || canArchiveTemplate(template, currentMember(), tenant());

    function memberName(id, fallback = "Anyone") {
      if (!id) return fallback;
      return memberMap.get(id)?.name ?? fallback;
    }

    async function db(sql, params = []) {
      if (!DB) return demoDb(sql, params);
      const res = await fetch(DB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params })
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Database request failed");
      return json;
    }

    // Atomic multi-statement form of /api/db. Rebuilding a template's steps is a
    // delete plus the inserts: issued one at a time, a failure partway through
    // left the routine with no steps at all (or half of them), which the UI has
    // no way to repair. D1 runs a batch as one transaction, so it lands whole or
    // not at all. The endpoint caps a batch at MAX_BATCH_STATEMENTS, and this
    // refuses a longer one rather than splitting it: a split commits the first
    // part on its own. The builders in logic.js cap step counts so every save
    // and every run start fits.
    async function dbBatch(statements) {
      if (!statements.length) return [];
      if (statements.length > MAX_BATCH_STATEMENTS) throw new RangeError("Too many changes to save at once.");
      if (!DB) return statements.map((s) => demoDb(s.sql));
      const res = await fetch(DB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ statements })
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Database request failed");
      return json.results ?? [];
    }

    async function publish(type, subject_id, payload = {}) {
      const url = EVENTS_URL || `/run/${APP_ID}/api/events`;
      await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, subject_id, payload })
      }).catch(() => {});
    }

    // One write at a time per key: a second tap while the first is in flight is
    // dropped, and a failure is said out loud instead of leaving a button that
    // appears to do nothing.
    const inFlight = new Set();
    async function once(key, action, failed = "Could not save that.", description = "Nothing was changed. Try again.") {
      if (inFlight.has(key)) return;
      inFlight.add(key);
      try {
        return await action();
      } catch (err) {
        hubAlert(failed, { description });
      } finally {
        inFlight.delete(key);
      }
    }

    async function loadMembers() {
      if (!CONTEXT) {
        members = [demoAdult, demoChild];
      } else {
        const res = await fetch(`${CONTEXT}?keys=family.members,family.groups,family.documents`);
        // A roster that could not be read is a failed load, not an empty household.
        if (!res.ok) throw new Error(`context ${res.status}`);
        const ctx = await res.json();
        if (!ctx || typeof ctx !== "object") throw new Error("context: unexpected response");
        // The hub answers 200 and names a key it could not resolve in `$errors`.
        if (Array.isArray(ctx.$errors) && ctx.$errors.includes("family.members")) throw new Error("context: family.members did not resolve");
        members = ctx["family.members"] ?? [];
      }
      memberMap = new Map(members.map((m) => [m.id, m]));
    }

    async function loadData() {
      if (!DB) seedDemo();
      // caregiver_packets and caregiver_packet_steps are `adult_only`: the hub
      // refuses the SELECT itself for a non-adult, not just the write. Fetching
      // them unconditionally threw before the first render, so a child opening
      // this app (its audience is `everyone`) got a blank frame and never
      // reached the "adult-only" notice renderPackets() draws for them. Skip
      // the read the way nest-egg does, and leave the arrays empty.
      const adult = userIsAdult();
      stepsError = false;
      const [t, ts, r, rs, p, ps] = await Promise.all([
        db("SELECT * FROM app_routines__templates ORDER BY created_at DESC"),
        db("SELECT * FROM app_routines__template_steps ORDER BY sort_order ASC"),
        // Only the ACTIVE runs, for the same reason as their steps below: Today
        // is the landing tab and shows nothing else, while History is a tab the
        // user has to ask for. loadHistory() fetches the recent rest on that first
        // open. A run that is completed or canceled in this session stays in the
        // array and shows up in History without a refetch.
        // LEFT JOIN run_details: a restricted run keeps its words there, under the
        // template's visibility. The policy lands on the ON clause, so a viewer
        // who may not read them still gets the run, with detail_* NULL.
        db(`SELECT r.*, d.title AS detail_title, d.caregiver_label AS detail_caregiver_label, d.notes AS detail_notes FROM app_routines__runs r LEFT JOIN app_routines__run_details d ON d.run_id = r.id WHERE r.status = 'active' ORDER BY r.started_at DESC LIMIT 25`),
        // Only the ACTIVE runs' steps. This table is the app's fastest grower —
        // a run per routine per day, several steps each, retained a year — and
        // the Today tab shows active runs only. History needs the rest, so it
        // fetches them once when that tab is first opened (loadHistory)
        // rather than making every launch pay for a year of them. A JOIN, not
        // IN (SELECT …): the rewriter fails closed on a governed table named
        // only inside a subquery, and this shape stays legal in roster mode.
        // Newest run first and capped, so the read stays under the hub's row
        // ceiling however many runs were never finished. The numbers are
        // ACTIVE_RUNS_SHOWN and ACTIVE_STEPS_READ in logic.js, written out because
        // the manifest preloads this exact text.
        // Its failure is survivable: the runs still load without their steps,
        // which is what leaves the stale ones closable when this read is the
        // one the hub refuses for size.
        db(`SELECT s.* FROM app_routines__run_steps s JOIN app_routines__runs r ON r.id = s.run_id AND r.status = 'active' ORDER BY r.started_at DESC, s.sort_order ASC LIMIT 2000`)
          .catch(() => { stepsError = true; return { rows: [] }; }),
        adult ? db("SELECT * FROM app_routines__caregiver_packets ORDER BY created_at DESC") : { rows: [] },
        adult ? db("SELECT * FROM app_routines__caregiver_packet_steps ORDER BY sort_order ASC") : { rows: [] }
      ]);
      templates = t.rows ?? [];
      templateSteps = ts.rows ?? [];
      runs = r.rows ?? [];
      runSteps = rs.rows ?? [];
      packets = p.rows ?? [];
      packetSteps = ps.rows ?? [];
    }

    function seedDemo() {
      if (templates.length) return;
      const now = new Date().toISOString();
      STARTER_TEMPLATES.slice(0, 3).forEach((starter, i) => {
        const template = {
          id: `demo-template-${i}`,
          title: starter.title,
          description: starter.description,
          category: starter.category,
          visibility: "everyone",
          owner_member_id: demoAdult.id,
          target_member_id: i < 2 ? demoChild.id : null,
          default_start_time: starter.default_start_time,
          default_duration_minutes: 45,
          archived_at: null,
          created_at: now,
          updated_at: now
        };
        templates.push(template);
        starter.steps.forEach((step, stepIndex) => {
          templateSteps.push({
            id: `${template.id}-step-${stepIndex}`,
            template_id: template.id,
            title: step[0],
            details: step[1],
            suggested_offset_minutes: step[2],
            assigned_member_id: step[3] === "kid" ? demoChild.id : null,
            role_label: step[3],
            required: step[4] ? 1 : 0,
            sort_order: stepIndex,
            created_at: now,
            updated_at: now
          });
        });
      });
    }

    function demoDb(sql) {
      if (sql.includes("app_routines__templates")) return { rows: templates };
      if (sql.includes("app_routines__template_steps")) return { rows: templateSteps };
      // run_steps first: its preload JOINs app_routines__runs, so a `runs`
      // check ahead of it would answer the steps read with the runs array.
      if (sql.includes("app_routines__run_steps")) return { rows: runSteps };
      if (sql.includes("app_routines__runs")) return { rows: runs };
      if (sql.includes("app_routines__caregiver_packets")) return { rows: packets };
      if (sql.includes("app_routines__caregiver_packet_steps")) return { rows: packetSteps };
      return { rows: [] };
    }

    // render() rewrites the whole view, so put the caret back after typing.
    document.addEventListener("input", (e) => {
      if (e.target.id !== "search") return;
      searchQ = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const next = document.getElementById("search");
      if (next) { next.focus(); next.setSelectionRange(caret, caret); }
    });

    function render() {
      document.getElementById("app").innerHTML = `
        <header>
          <div>
            <h1>Routines</h1>
            <p class="muted">Reusable playbooks for household flow and share-safe caregiver instructions.</p>
          </div>
          <div class="toolbar">
            ${loadFailed ? "" : `${userIsAdult() ? `<button class="primary" onclick="openTemplateModal()" data-testid="new-template">New Template</button>` : ""}${userSupervisesRuns() ? `<button onclick="openRunModal()" data-testid="start-routine">Start Routine</button>` : ""}`}
          </div>
        </header>
        <nav class="tabs">
          ${["today", "templates", "packets", "history"].map((key) => `<button class="tab ${tab === key ? "active" : ""}" onclick="setTab('${key}')" data-testid="tab-${key}">${key[0].toUpperCase() + key.slice(1)}</button>`).join("")}
        </nav>
        ${loadFailed ? `<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load routines.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>` : ""}
        ${loadFailed ? "" : tab === "today" ? renderToday() : ""}
        ${loadFailed ? "" : tab === "templates" ? renderTemplates() : ""}
        ${loadFailed ? "" : tab === "packets" ? renderPackets() : ""}
        ${loadFailed ? "" : tab === "history" ? renderHistory() : ""}
      `;
    }

    function renderToday() {
      const active = runs.filter((r) => r.status === "active" && runShown(r));
      if (!active.length) return `<div class="empty">No active routines. Start one from a template when the day needs a little structure.</div>`;
      // Runs nobody finished pile up here and are gone from the kiosk, which
      // shows today's only. Whoever supervises can close them in one go.
      const stale = userSupervisesRuns() ? staleRuns(runs, hubToday()).length : 0;
      const staleNote = stale ? `<div class="empty" data-testid="stale-runs"><p>${stale === ACTIVE_RUNS_SHOWN ? "Many routines" : `${stale} routine${stale === 1 ? "" : "s"}`} from earlier days ${stale === 1 ? "is" : "are"} still open.</p><div class="toolbar"><button onclick="closeStaleRuns()" data-testid="close-stale-runs">Close them</button></div></div>` : "";
      // The launch read stops at the newest ACTIVE_RUNS_SHOWN; say so when it
      // is full, since older ones are open but not on this page.
      const cappedNote = runs.filter((r) => r.status === "active").length >= ACTIVE_RUNS_SHOWN
        ? `<p class="muted" data-testid="active-capped">Showing the ${ACTIVE_RUNS_SHOWN} most recently started routines. Finish or cancel some to see older ones.</p>` : "";
      const stepsNote = stepsError ? `<div class="empty" role="alert" data-testid="steps-error">The steps of these routines could not be loaded. Reload to try again.</div>` : "";
      return `${staleNote}${stepsNote}<div class="grid">${active.map(renderRunCard).join("")}</div>${cappedNote}`;
    }

    function renderHistory() {
      const history = runs.filter((r) => r.status !== "active" && runShown(r));
      // A failed read is not an empty history: say so, above whatever this
      // session already holds. Opening the tab again retries.
      const failed = historyError ? `<div class="empty" role="alert" data-testid="history-error">Past routines could not be loaded. Open History again to retry.</div>` : "";
      if (!history.length) return failed || `<div class="empty">Completed and canceled routines will show up here.</div>`;
      return `${failed}<div class="stack">${history.map(renderRunCard).join("")}</div>${historyCapped ? `<p class="muted" data-testid="history-capped">Showing the latest ${HISTORY_RUNS} routines.</p>` : ""}`;
    }

    function runShown(run) {
      return showRunTo(run, runSteps.filter((s) => s.run_id === run.id), userSupervisesRuns());
    }

    function renderRunCard(run) {
      const steps = sortByOrder(runSteps.filter((s) => s.run_id === run.id));
      const shown = runDisplay(run);
      const summary = completionSummary(steps);
      const pct = summary.total ? Math.round((summary.done / summary.total) * 100) : 0;
      // Only a run supervisor reads every step. Anyone else has just the steps
      // assigned to them, so their progress is labelled as theirs and Finish,
      // which needs the whole run's required steps, is not offered.
      const supervises = userSupervisesRuns();
      return `
        <section class="card">
          <div class="row">
            <div>
              <h2 data-testid="run-title" data-run-id="${esc(run.id)}">${esc(shown.title ?? "Private routine")}</h2>
              <p class="muted">${esc(run.run_date)} · ${esc(memberName(run.target_member_id, "Everyone"))}${shown.caregiverLabel ? ` · ${esc(shown.caregiverLabel)}` : ""}</p>
              ${shown.notes ? `<p class="muted" data-testid="run-notes">${esc(shown.notes)}</p>` : ""}
            </div>
            <span class="badge ${esc(run.status)}">${esc(run.status)}</span>
          </div>
          ${supervises
            ? `<div class="progress" aria-label="${pct}% complete"><span style="--pct:${pct}%"></span></div>
          <p class="muted">${summary.done}/${summary.total} done · ${summary.doneRequired}/${summary.required} required</p>`
            : summary.total ? `<div class="progress" aria-label="${pct}% of your steps complete"><span style="--pct:${pct}%"></span></div>
          <p class="muted" data-testid="own-progress">Your steps: ${summary.done}/${summary.total} done</p>` : ""}
          <div class="steps">${steps.map((step) => renderRunStep(run, step)).join("")}</div>
          ${run.status === "active" && userIsAdult() ? `<div class="toolbar">${supervises ? `<button onclick="completeRunIfReady('${sid(run.id)}')">Finish Routine</button>` : ""}<button class="danger" onclick="cancelRun('${sid(run.id)}')">Cancel</button></div>` : ""}
        </section>
      `;
    }

    function renderRunStep(run, step) {
      const canWrite = run.status === "active" && canCompleteStep(step, currentMember(), userSupervisesRuns());
      return `
        <div class="step ${esc(step.status)}">
          <div class="row">
            <div>
              <div class="step-title">${step.icon_snapshot ? `<span class="step-emoji">${esc(step.icon_snapshot)}</span> ` : ""}${esc(step.title_snapshot)}</div>
              ${step.details_snapshot ? `<p class="muted">${esc(step.details_snapshot)}</p>` : ""}
              <p class="muted">${step.required ? "Required" : "Optional"} · ${esc(memberName(step.assigned_member_id, step.role_label || "Anyone"))}</p>
            </div>
            <span class="badge ${esc(step.status)}">${esc(step.status)}</span>
          </div>
          ${canWrite ? `<div class="step-actions"><button onclick="setStepStatus('${sid(step.id)}','done')">Done</button><button onclick="setStepStatus('${sid(step.id)}','skipped')">Skip</button><button class="ghost" onclick="setStepStatus('${sid(step.id)}','pending')">Reset</button></div>` : ""}
        </div>
      `;
    }

    function renderTemplates() {
      const all = visibleTemplates(templates);
      const rows = searchQ ? all.filter(t => searchMatch(searchQ, searchableFields(t))) : all;
      return `
        <div class="toolbar">
          ${userIsAdult() ? `<button onclick="installStarterTemplates()">Add Starter Templates</button>` : ""}
        </div>
        ${all.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search routines…" aria-label="Search routines" value="${esc(searchQ)}" /></div>` : ""}
        ${rows.length
          ? `<div class="grid">${rows.map(renderTemplateCard).join("")}</div>`
          : searchQ
            ? `<div class="empty">No routines match "${esc(searchQ)}".</div>`
            : `<div class="empty">No templates yet. Add starter templates or create your own.</div>`}
      `;
    }

    function renderTemplateCard(template) {
      const steps = sortByOrder(templateSteps.filter((s) => s.template_id === template.id));
      return `
        <section class="card" data-testid="template-card" data-template-id="${esc(template.id)}">
          <div class="row">
            <div>
              <h2>${esc(template.title)}</h2>
              <p class="muted">${esc(template.description || "")}</p>
            </div>
            <span class="badge">${esc(template.visibility)}</span>
          </div>
          <p class="muted">${esc(template.category)} · ${steps.length} steps · ${esc(memberName(template.target_member_id, "Everyone"))}</p>
          <div class="steps">${steps.map((s) => `<div class="step"><div class="step-title">${esc(s.title)}</div><p class="muted">${esc(s.details || "")}</p></div>`).join("")}</div>
          ${userIsAdult() ? `<div class="toolbar" data-testid="template-actions" data-template-id="${esc(template.id)}">${userSupervisesRuns() ? `<button onclick="openRunModal('${sid(template.id)}')" data-testid="template-start">Start</button>` : ""}${userCanEditTemplate(template) ? `<button onclick="openTemplateModal('${sid(template.id)}')" data-testid="template-edit">Edit</button>` : ""}<button onclick="openPacketModal('${sid(template.id)}')" data-testid="template-packet">Packet</button>${userCanArchiveTemplate(template) ? `<button class="danger" onclick="archiveTemplate('${sid(template.id)}')" data-testid="template-archive">Archive</button>` : ""}</div>` : ""}
        </section>
      `;
    }

    function renderPackets() {
      if (!userIsAdult()) return `<div class="empty" data-testid="packets-locked">Caregiver packets are adult-only.</div>`;
      return `
        <div class="toolbar"><button class="primary" onclick="openPacketModal()" data-testid="new-packet">New Packet</button></div>
        ${packets.length ? `<div class="stack">${packets.map(renderPacketCard).join("")}</div>` : `<div class="empty">Create a printable packet with only the instructions a caregiver should see.</div>`}
      `;
    }

    function renderPacketCard(packet) {
      const steps = sortByOrder(packetSteps.filter((s) => s.packet_id === packet.id));
      return `
        <section class="card">
          <div class="row">
            <div><h2>${esc(packet.title)}</h2><p class="muted">${steps.length} shared steps · created ${esc(packet.created_at.slice(0, 10))}</p></div>
            <div class="toolbar">
              ${share.enabled ? `<button onclick="openPacketShare('${sid(packet.id)}')" data-testid="packet-share">Share</button>` : ""}
              <button onclick="openPacketView('${sid(packet.id)}')">View / Print</button>
            </div>
          </div>
        </section>
      `;

    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", (event) => { if (event.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
    }

    window.closeModal = () => closeModal();
    function closeModal() { modalEl?.remove(); modalEl = null; }
    // History renders every past run and a per-run step summary, but the
    // preload carries only the active runs and their steps. Fetch the remainder
    // once, the first time History is opened. The promise itself is the guard,
    // so a double tap cannot start two reads; a failure clears it so the next
    // attempt retries. Both merges dedup by id: a run completed in this session
    // is already in the array, and so are the active runs' steps.
    //
    // The latest HISTORY_RUNS past runs, then the steps of exactly those: a
    // year of runs is retained, and reading every step of every one of them
    // made the first open of this tab grow with the household's history. The
    // cap also keeps the step read's id list under D1's 100 bound parameters.
    const HISTORY_RUNS = 40;
    let historyPromise = null;
    let historyError = false;   // the last load failed: said on the tab, not shown as "none yet"
    let historyCapped = false;  // more past runs exist than are shown
    function loadHistory() {
      if (!DB) return Promise.resolve();
      historyPromise ??= (async () => {
        const past = (await db(`SELECT r.*, d.title AS detail_title, d.caregiver_label AS detail_caregiver_label, d.notes AS detail_notes FROM app_routines__runs r LEFT JOIN app_routines__run_details d ON d.run_id = r.id WHERE r.status != 'active' ORDER BY r.started_at DESC LIMIT ${HISTORY_RUNS}`)).rows ?? [];
        const steps = past.length
          ? (await db(`SELECT * FROM app_routines__run_steps WHERE run_id IN (${past.map(() => "?").join(",")}) ORDER BY sort_order ASC`, past.map((r) => r.id))).rows ?? []
          : [];
        // What was just read wins over what the page held: a run loaded as
        // active and closed somewhere else since is a past run now, and keeping
        // the older copy left it on Today and out of History.
        const pastIds = new Set(past.map((r) => r.id));
        runs = [...runs.filter((r) => !pastIds.has(r.id)), ...past];
        const stepIds = new Set(steps.map((s) => s.id));
        runSteps = [...runSteps.filter((s) => !stepIds.has(s.id)), ...steps];
        historyCapped = past.length === HISTORY_RUNS;
      })().catch((e) => { historyPromise = null; throw e; });
      return historyPromise;
    }

    window.setTab = (next) => {
      tab = next;
      render();
      if (next === "history") {
        historyError = false;
        loadHistory().then(render).catch(() => { historyError = true; render(); });
      }
    };

    window.openTemplateModal = (templateId = "") => {
      const existing = templateId ? templates.find((t) => t.id === templateId) : null;
      if (existing && !userCanEditTemplate(existing)) return;
      const template = templates.find((t) => t.id === templateId) ?? {
        title: "", description: "", category: "household", visibility: "everyone", target_member_id: "", default_start_time: "", default_duration_minutes: 45
      };
      const steps = templateId ? sortByOrder(templateSteps.filter((s) => s.template_id === templateId)) : [{ title: "", details: "", suggested_offset_minutes: 0, assigned_member_id: "", role_label: "", required: 1 }];
      openModal(`
        <h2>${templateId ? "Edit Template" : "New Template"}</h2>
        <form id="template-form">
          <div class="form-grid">
            ${field("Title", "title", template.title)}
            ${field("Category", "category", template.category)}
            ${selectField("Visibility", "visibility", template.visibility, visibilityChoices(template.visibility))}
            ${memberSelect("Target", "target_member_id", template.target_member_id)}
            ${field("Default time", "default_start_time", template.default_start_time, "time")}
            ${field("Minutes", "default_duration_minutes", template.default_duration_minutes, "number")}
          </div>
          <div class="field"><label>Description</label><textarea name="description">${esc(template.description || "")}</textarea></div>
          <label>Steps</label>
          <div id="step-editors">${steps.map((s, i) => stepEditor(s, i)).join("")}</div>
          <button type="button" onclick="addStepEditor()">Add Step</button>
          <div class="modal-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save</button></div>
        </form>
      `);
      document.getElementById("template-form").addEventListener("submit", (event) => {
        event.preventDefault();
        once("template", () => saveTemplate(event, templateId));
      });
    };

    function field(label, name, value = "", type = "text") {
      return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value ?? "")}"></div>`;
    }

    function selectField(label, name, value, options) {
      return `<div class="field"><label>${label}</label><select name="${name}">${options.map(([v,l]) => `<option value="${esc(v)}" ${v === value ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
    }

    function memberSelect(label, name, value = "") {
      return `<div class="field"><label>${label}</label><select name="${name}"><option value="">Everyone</option>${members.map((m) => `<option value="${esc(m.id)}" ${m.id === value ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></div>`;
    }

    function stepEditor(step, i) {
      const icon = normalizeIcon(step.icon ?? step.icon_snapshot ?? "");
      // The icon is the label on the kiosk tile grid, where a pre-reader has
      // nothing else to go on — so it gets a first-class picker, not a
      // buried option.
      return `<div class="step-editor" data-step>
        <button type="button" class="step-icon" data-icon-button title="Pick a picture" onclick="toggleIconPicker(this)">${esc(icon || "＋")}</button>
        <input name="step_icon" type="hidden" value="${esc(icon)}">
        <input name="step_role" type="hidden" value="${esc(step.role_label ?? "")}">
        <input name="step_title" placeholder="Step title" value="${esc(step.title ?? step.title_snapshot ?? "")}">
        <input name="step_details" placeholder="Details" value="${esc(step.details ?? step.details_snapshot ?? "")}">
        <input name="step_offset" type="number" placeholder="Minutes" value="${esc(step.suggested_offset_minutes ?? 0)}">
        <input name="step_timer" type="number" min="1" max="120" placeholder="Timer" value="${esc(step.timer_minutes ?? "")}" title="Optional countdown shown on the kiosk tile (minutes)">
        <select name="step_member"><option value="">Anyone</option>${members.map((m) => `<option value="${esc(m.id)}" ${m.id === step.assigned_member_id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
        <label><input name="step_required" type="checkbox" ${Number(step.required ?? 1) === 1 ? "checked" : ""}> Req</label>
        <button type="button" onclick="this.closest('[data-step]').remove()">×</button>
        <div class="icon-picker" hidden>
          ${ROUTINE_ICONS.map((choice) => `<button type="button" onclick="pickIcon(this, '${choice}')">${choice}</button>`).join("")}
          <button type="button" class="icon-clear" onclick="pickIcon(this, '')">Clear</button>
        </div>
      </div>`;
    }

    window.toggleIconPicker = (button) => {
      const picker = button.closest("[data-step]").querySelector(".icon-picker");
      picker.hidden = !picker.hidden;
    };

    window.pickIcon = (button, choice) => {
      const row = button.closest("[data-step]");
      row.querySelector('[name="step_icon"]').value = choice;
      row.querySelector("[data-icon-button]").textContent = choice || "＋";
      row.querySelector(".icon-picker").hidden = true;
    };

    window.addStepEditor = () => {
      if (document.querySelectorAll("#step-editors [data-step]").length >= MAX_ROUTINE_STEPS) {
        return hubAlert(`A routine can have at most ${MAX_ROUTINE_STEPS} steps.`, { description: "Split a long routine into two, so each one saves in a single step." });
      }
      document.getElementById("step-editors").insertAdjacentHTML("beforeend", stepEditor({}, Date.now()));
    };

    async function saveTemplate(event, templateId) {
      event.preventDefault();
      const form = new FormData(event.target);
      const now = new Date().toISOString();
      const id = templateId || crypto.randomUUID();
      const row = {
        id,
        title: form.get("title").toString().trim() || "Untitled Routine",
        description: form.get("description").toString(),
        category: form.get("category").toString() || "household",
        visibility: form.get("visibility").toString(),
        owner_member_id: currentMember().id,
        target_member_id: form.get("target_member_id").toString() || null,
        default_start_time: form.get("default_start_time").toString() || null,
        default_duration_minutes: Number(form.get("default_duration_minutes") || 45),
        archived_at: null,
        created_at: templates.find((t) => t.id === id)?.created_at ?? now,
        updated_at: now
      };
      const doomedStepIds = templateId ? templateSteps.filter((s) => s.template_id === id).map((s) => s.id) : [];
      const stepRows = [...document.querySelectorAll("[data-step]")].map((el, sort_order) => ({
        id: crypto.randomUUID(),
        template_id: id,
        title: el.querySelector('[name="step_title"]').value.trim() || "Untitled step",
        details: el.querySelector('[name="step_details"]').value,
        icon: normalizeIcon(el.querySelector('[name="step_icon"]').value),
        suggested_offset_minutes: Number(el.querySelector('[name="step_offset"]').value || 0),
        timer_minutes: Number(el.querySelector('[name="step_timer"]').value) || null,
        assigned_member_id: el.querySelector('[name="step_member"]').value || null,
        role_label: el.querySelector('[name="step_role"]')?.value ?? "",
        required: el.querySelector('[name="step_required"]').checked ? 1 : 0,
        sort_order,
        created_at: now,
        updated_at: now
      }));
      // One transactional batch, so a failure after the delete cannot leave the
      // routine with no steps. See templateSaveStatements for why a save that
      // cannot reach the old steps is refused rather than applied.
      if (stepRows.length > MAX_ROUTINE_STEPS) {
        return hubAlert(`A routine can have at most ${MAX_ROUTINE_STEPS} steps.`, { description: "Remove some steps, or split the routine into two." });
      }
      try {
        if (templateId) {
          // The version this tab loaded: a save from a stale editor is refused
          // rather than silently replacing a newer one (see templateSaveStatements).
          const loadedUpdatedAt = templates.find((t) => t.id === id)?.updated_at;
          const statements = templateSaveStatements({ templateId, row, loadedUpdatedAt, doomedStepIds, stepRows, memberId: currentMember().id });
          await dbBatch(statements);
        } else {
          await createTemplate(templateCreatePlan({ row, stepRows, memberId: currentMember().id }));
        }
      } catch (err) {
        return hubAlert("Could not save this template.", {
          description: "It may have changed since you opened it, or it was set up by someone whose steps you can't replace here. Reload and try again, or ask whoever created it."
        });
      }
      if (templateId) {
        // The save does not move ownership, so the owner on screen stays put.
        templates = templates.map((t) => t.id === id ? { ...t, ...row, owner_member_id: t.owner_member_id } : t);
        templateSteps = templateSteps.filter((s) => s.template_id !== id);
      } else {
        templates.unshift(row);
      }
      templateSteps.push(...stepRows);
      closeModal();
      render();
    }

    // Guarded: installation skips a title that is already there, and a second
    // tap would check before the first tap's inserts had landed.
    window.installStarterTemplates = () => once("starters", async () => {
      try {
        for (const starter of STARTER_TEMPLATES) await createTemplateFromStarter(starter);
      } catch (err) {
        // What is stored, not what this page believes: a template whose steps
        // failed and whose removal also failed is there without them, and the
        // next attempt skips a title only if it can see it.
        await reloadTemplates().catch(() => {});
        hubAlert("Could not add every starter template.", { description: "The ones already added are kept. Try again to add the rest." });
      }
      render();
    });

    async function reloadTemplates() {
      const [t, ts] = await Promise.all([
        db("SELECT * FROM app_routines__templates ORDER BY created_at DESC"),
        db("SELECT * FROM app_routines__template_steps ORDER BY sort_order ASC")
      ]);
      templates = t.rows ?? [];
      templateSteps = ts.rows ?? [];
    }

    // See templateCreatePlan: the template, then its steps as one batch, and the
    // template removed again if the steps do not land.
    async function createTemplate(plan) {
      await dbBatch([plan.create]);
      if (!plan.steps.length) return;
      try {
        await dbBatch(plan.steps);
      } catch (err) {
        await dbBatch([plan.undo]).catch(() => {});
        throw err;
      }
    }

    async function createTemplateFromStarter(starter) {
      if (templates.some((t) => t.title === starter.title && !t.archived_at)) return;
      const now = new Date().toISOString();
      const id = crypto.randomUUID();
      const target = starter.category === "kids" ? members.find((m) => m.role === "child")?.id ?? null : null;
      const row = { id, title: starter.title, description: starter.description, category: starter.category, visibility: "everyone", owner_member_id: currentMember().id, target_member_id: target, default_start_time: starter.default_start_time, default_duration_minutes: 45, archived_at: null, created_at: now, updated_at: now };
      const stepRows = starter.steps.map((step, sort_order) => ({ id: crypto.randomUUID(), template_id: id, title: step[0], details: step[1], suggested_offset_minutes: step[2], assigned_member_id: step[3] === "kid" ? target : null, role_label: step[3], required: step[4] ? 1 : 0, icon: step[5] ?? "", timer_minutes: null, sort_order, created_by_member_id: currentMember().id, created_at: now, updated_at: now }));
      // A starter arrives whole or not at all: one statement at a time left a
      // half-built routine that looks installed, and installStarterTemplates
      // then skips it on the next attempt (it dedupes on the title).
      await createTemplate(templateCreatePlan({ row, stepRows, memberId: currentMember().id }));
      templates.unshift({ id, title: starter.title, description: starter.description, category: starter.category, visibility: "everyone", owner_member_id: currentMember().id, target_member_id: target, default_start_time: starter.default_start_time, default_duration_minutes: 45, archived_at: null, created_at: now, updated_at: now });
      templateSteps.push(...stepRows);
    }

    window.openRunModal = (templateId = "") => {
      const options = visibleTemplates(templates);
      if (!options.length) return hubAlert("Create a template first.", { description: "Routines start from reusable templates." });
      const chosen = templateId || options[0].id;
      openModal(`
        <h2>Start Routine</h2>
        <form id="run-form">
          ${selectField("Template", "template_id", chosen, options.map((t) => [t.id, t.title]))}
          <div class="form-grid">
            ${field("Date", "run_date", hubToday(), "date")}
            ${memberSelect("For", "target_member_id", templates.find((t) => t.id === chosen)?.target_member_id ?? "")}
          </div>
          ${field("Caregiver label", "caregiver_label", "")}
          <div class="field"><label>Notes</label><textarea name="notes"></textarea></div>
          <div class="modal-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Start</button></div>
        </form>
      `);
      const runForm = document.getElementById("run-form");
      // "For" starts as the chosen template's member and follows the template
      // until the adult picks someone. Left as first drawn, a run of another
      // template went to the first one's member, and so did every step of it
      // that names nobody.
      let forChosen = false;
      runForm.elements.target_member_id.addEventListener("change", () => { forChosen = true; });
      runForm.elements.template_id.addEventListener("change", (event) => {
        if (forChosen) return;
        runForm.elements.target_member_id.value = templates.find((t) => t.id === event.target.value)?.target_member_id ?? "";
      });
      runForm.addEventListener("submit", (event) => {
        event.preventDefault();
        once("run", () => startRun(event));
      });
    };

    async function startRun(event) {
      event.preventDefault();
      const form = new FormData(event.target);
      const template = templates.find((t) => t.id === form.get("template_id"));
      if (!template) return;
      if (!userSupervisesRuns()) return;
      const steps = sortByOrder(templateSteps.filter((s) => s.template_id === template.id));
      let built;
      try {
        // The run, its private details and every step go as one batch, so a
        // failure never leaves a run with half its steps.
        built = buildRun({
          template, steps, runId: crypto.randomUUID(), memberId: currentMember().id,
          runDate: form.get("run_date").toString() || hubToday(), targetMemberId: form.get("target_member_id").toString(),
          caregiverLabel: form.get("caregiver_label").toString(), notes: form.get("notes").toString(),
          now: new Date().toISOString(), stepId: () => crypto.randomUUID()
        });
        await dbBatch(built.statements);
      } catch (err) {
        return hubAlert("Could not start this routine.", {
          description: err instanceof RangeError
            ? `${err.message} Edit the template down to ${MAX_ROUTINE_STEPS} steps, then start it again.`
            : "Nothing was saved. Try again."
        });
      }
      const run = built.details
        ? { ...built.run, detail_title: built.details.title, detail_caregiver_label: built.details.caregiver_label, detail_notes: built.details.notes }
        : built.run;
      runs.unshift(run);
      runSteps.push(...built.runSteps);
      if (mayPublishRun(run)) publish("routine.started", run.id, { title: run.title_snapshot, run_date: run.run_date });
      tab = "today";
      closeModal();
      render();
    }

    window.setStepStatus = (stepId, status) => once(`step:${stepId}`, () => setStepStatus(stepId, status), "Could not update this step.");

    async function setStepStatus(stepId, status) {
      let step = runSteps.find((s) => s.id === stepId);
      if (!step || !canCompleteStep(step, currentMember(), userSupervisesRuns())) return;
      // Already there: writing it again would put this member's name and time
      // over whoever did it, and announce a second completion.
      if (step.status === status) return;
      const completedAt = status === "done" || status === "skipped" ? new Date().toISOString() : null;
      const completedBy = completedAt ? currentMember().id : null;
      // Matched on the status this page last saw. The page does not hear about
      // a tick made on the kiosk or another phone, and writing over one put this
      // member's name and time on a step someone else had already done.
      const { changed } = await db("UPDATE app_routines__run_steps SET status=?, completed_by_member_id=?, completed_at=? WHERE id=? AND status=?", [status, completedBy, completedAt, stepId, step.status]);
      // Found again: a re-read of the run's steps while this was out replaced
      // the objects, and the answer belongs on the one the page now draws.
      step = runSteps.find((s) => s.id === stepId) ?? step;
      if (changed === 0) {
        const fresh = ((await db("SELECT * FROM app_routines__run_steps WHERE id=?", [stepId])).rows ?? [])[0];
        if (fresh) Object.assign(step, fresh);
        // Nothing came back: the step is gone, or no longer this member's to read.
        else runSteps = runSteps.filter((s) => s.id !== stepId);
        render();
        return fresh
          ? hubAlert("This step was already updated somewhere else.", { description: "It now shows where it stands. Change it again if you still need to." })
          : hubAlert("This step is no longer yours to update.", { description: "It was removed or given to someone else." });
      }
      Object.assign(step, { status, completed_by_member_id: completedBy, completed_at: completedAt });
      const run = runs.find((r) => r.id === step.run_id);
      if (status === "done" && run && mayPublishRun(run)) publish("routine.step_completed", step.run_id, { step_id: step.id, title: step.title_snapshot });
      render();
    }

    // The whole of it under one guard, read included: a second tap used to start
    // its own read, find the run just finished by the first, and report that
    // someone else had closed it.
    window.completeRunIfReady = (runId) => once(`finish:${runId}`, async () => {
      // Readiness is judged on every step of the run, which only a supervisor reads.
      if (!userSupervisesRuns()) return;
      // On the steps as stored now: ticks made on the kiosk since this page
      // loaded count, and without them Finish was refused until a reload. A
      // read that fails decides nothing. Falling back to what the page held
      // finished a run on no steps at all when those had never loaded.
      if (DB) {
        let fresh;
        try {
          fresh = (await db("SELECT * FROM app_routines__run_steps WHERE run_id=?", [runId])).rows ?? [];
        } catch {
          return hubAlert("Could not check this routine's steps.", { description: "Nothing was changed. Try again." });
        }
        runSteps = [...runSteps.filter((s) => s.run_id !== runId), ...fresh];
      }
      if (runs.find((r) => r.id === runId)?.status !== "active") return render();
      const summary = completionSummary(runSteps.filter((s) => s.run_id === runId));
      if (!summary.isComplete) {
        render();
        return hubAlert("Required steps are not finished yet.", { description: "Complete required steps before finishing the routine." });
      }
      await setRunStatus(runId, "completed");
    }, "Could not finish this routine.");

    window.cancelRun = async (runId) => {
      if (await hubConfirm({ message: "Cancel this routine?", confirmLabel: "Cancel Routine", destructive: true })) {
        await once(`run:${runId}`, () => setRunStatus(runId, "canceled"), "Could not cancel this routine.");
      }
    };

    async function setRunStatus(runId, status) {
      const now = new Date().toISOString();
      const completedAt = status === "completed" ? now : null;
      const canceledAt = status === "canceled" ? now : null;
      // An active run only. Another adult may have finished or canceled it
      // since this page loaded, and that answer stands: writing over it turned
      // a canceled run into a completed one and raised its completion alert.
      const { changed } = await db("UPDATE app_routines__runs SET status=?, completed_at=?, canceled_at=? WHERE id=? AND status='active'", [status, completedAt, canceledAt, runId]);
      const run = runs.find((r) => r.id === runId);
      if (changed === 0) {
        const fresh = ((await db("SELECT status, completed_at, canceled_at FROM app_routines__runs WHERE id=?", [runId])).rows ?? [])[0];
        if (fresh) Object.assign(run, fresh);
        else runs = runs.filter((r) => r.id !== runId);   // removed altogether
        render();
        return fresh && fresh.status !== "active"
          ? hubAlert("This routine was already closed somewhere else.", { description: "It has moved to History." })
          : hubAlert(fresh ? "Could not update this routine." : "This routine is no longer there.", { description: fresh ? "Nothing was changed. Try again." : "It was removed since this page loaded." });
      }
      Object.assign(run, { status, completed_at: completedAt, canceled_at: canceledAt });
      if (status === "completed" && mayPublishRun(run)) publish("routine.completed", runId, { title: run.title_snapshot });
      render();
    }

    // Every loaded run from an earlier day, in as few batches as the hub's
    // statement cap allows. No completion events: these are closed in bulk,
    // long after the fact, and each would raise an alert.
    // The closures for the runs left open from earlier days, decided on the
    // steps as stored NOW rather than as this page holds them: a run the kids
    // finished on the kiosk since is finished, and a cancel cannot be taken
    // back here. Throws when the steps cannot be read, so nothing is decided
    // on a guess.
    async function freshStaleClosures() {
      const stale = staleRuns(runs, hubToday());
      if (DB && stale.length) {
        const fresh = (await db(`SELECT * FROM app_routines__run_steps WHERE run_id IN (${stale.map(() => "?").join(",")})`, stale.map((r) => r.id))).rows ?? [];
        const staleIds = new Set(stale.map((r) => r.id));
        runSteps = [...runSteps.filter((s) => !staleIds.has(s.run_id)), ...fresh];
      }
      return staleRunClosures(runs, runSteps, hubToday(), new Date().toISOString());
    }

    window.closeStaleRuns = async () => {
      if (!userSupervisesRuns()) return;
      const cannotCheck = () => hubAlert("Could not check those routines' steps.", { description: "Nothing was closed. Try again." });
      let proposed;
      try {
        proposed = await freshStaleClosures();
      } catch {
        return cannotCheck();
      }
      if (!proposed.length) return;
      const finished = proposed.filter((c) => c.status === "completed").length;
      const ok = await hubConfirm({
        message: `Close ${proposed.length} routine${proposed.length === 1 ? "" : "s"} from earlier days?`,
        description: `${finished} with every required step done will be marked completed. The other ${proposed.length - finished} will be canceled.`,
        confirmLabel: "Close them"
      });
      if (!ok) return;
      await once("stale-runs", async () => {
        // Decided again, after the question: the dialog can sit open while the
        // kiosk is still being ticked, and what was counted before it opened
        // would cancel a run that was finished in the meantime.
        let closures;
        try {
          closures = await freshStaleClosures();
        } catch {
          return cannotCheck();
        }
        for (let i = 0; i < closures.length; i += MAX_BATCH_STATEMENTS) {
          const part = closures.slice(i, i + MAX_BATCH_STATEMENTS);
          await dbBatch(part.map((c) => c.statement));
          for (const c of part) {
            const run = runs.find((r) => r.id === c.runId);
            if (run) Object.assign(run, { status: c.status, completed_at: c.completed_at, canceled_at: c.canceled_at });
          }
        }
        // More may have been waiting behind the ones this page had loaded. The
        // reload holds active runs only, so History is read again when asked.
        await loadData();
        historyPromise = null;
        render();
      }, "Could not close every routine.", "Some may have been closed. Reload to see which are left.");
      render();
    };

    window.archiveTemplate = async (templateId) => {
      const template = templates.find((t) => t.id === templateId);
      if (!template || !userCanArchiveTemplate(template)) return;
      if (!(await hubConfirm({ message: "Archive this template?", confirmLabel: "Archive" }))) return;
      await once(`archive:${templateId}`, async () => {
        const now = new Date().toISOString();
        const { changed } = await db("UPDATE app_routines__templates SET archived_at=?, updated_at=? WHERE id=?", [now, now, templateId]);
        // The hub answers 200 with nothing changed for a template this member may
        // not write, so it is only shown as archived once a row really changed.
        if (changed === 0) return hubAlert("Could not archive this template.", { description: "Only its owner or whoever supervises routines here can archive it." });
        templates = templates.map((t) => t.id === templateId ? { ...t, archived_at: now, updated_at: now } : t);
        render();
      }, "Could not archive this template.");
    };

    // The step checklist and the suggested title belong to the chosen source
    // template, so both are redrawn when the choice changes. Left as first
    // drawn, a packet was saved under one template with another's steps.
    const packetTitleFor = (templateId) => {
      const template = templates.find((t) => t.id === templateId);
      return template ? `${template.title} Instructions` : "Caregiver Instructions";
    };
    const packetStepChecks = (templateId) => sortByOrder(templateSteps.filter((s) => templateId && s.template_id === templateId))
      .map((s) => `<label><input type="checkbox" name="step_id" value="${esc(s.id)}" checked> ${esc(s.title)}</label>`).join("");

    window.openPacketModal = (templateId = "") => {
      const options = visibleTemplates(templates);
      const chosen = templateId || options[0]?.id || "";
      openModal(`
        <h2>Caregiver Packet</h2>
        <form id="packet-form">
          ${selectField("Source template", "template_id", chosen, options.map((t) => [t.id, t.title]))}
          ${field("Packet title", "title", packetTitleFor(chosen))}
          <div class="field"><label>Safe notes</label><textarea name="safe_notes" placeholder="Only include information this caregiver should see."></textarea></div>
          <div class="form-grid">
            <label><input type="checkbox" name="include_contacts"> Include contacts reminder</label>
            <label><input type="checkbox" name="include_health_notes"> Include health notes reminder</label>
            <label><input type="checkbox" name="include_documents"> Include document reminder</label>
          </div>
          <label>Shared steps</label>
          <div class="stack" id="packet-steps">${packetStepChecks(chosen)}</div>
          <div class="modal-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Create Packet</button></div>
        </form>
      `);
      const form = document.getElementById("packet-form");
      let suggestedTitle = packetTitleFor(chosen);
      form.elements.template_id.addEventListener("change", (event) => {
        const next = event.target.value;
        document.getElementById("packet-steps").innerHTML = packetStepChecks(next);
        // A title the adult typed is theirs; only the suggestion follows.
        if (form.elements.title.value === suggestedTitle) form.elements.title.value = packetTitleFor(next);
        suggestedTitle = packetTitleFor(next);
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        once("packet", () => savePacket(event), "Could not create this packet.");
      });
    };

    async function savePacket(event) {
      const form = new FormData(event.target);
      const now = new Date().toISOString();
      const packet = { id: crypto.randomUUID(), template_id: form.get("template_id")?.toString() || null, run_id: null, title: form.get("title").toString().trim() || "Caregiver Instructions", safe_notes: form.get("safe_notes").toString(), include_contacts: form.has("include_contacts") ? 1 : 0, include_health_notes: form.has("include_health_notes") ? 1 : 0, include_documents: form.has("include_documents") ? 1 : 0, created_by_member_id: currentMember().id, created_at: now, updated_at: now };
      const selected = new Set(form.getAll("step_id"));
      const stepRows = sortByOrder(templateSteps.filter((s) => selected.has(s.id) && s.template_id === packet.template_id))
        .map((step, sort_order) => ({ id: crypto.randomUUID(), packet_id: packet.id, source_step_id: step.id, title_snapshot: step.title, details_snapshot: step.details ?? "", sort_order }));
      // The packet and its steps land together or not at all.
      await dbBatch(packetSaveStatements({ packet, stepRows }));
      packets.unshift(packet);
      packetSteps.push(...stepRows);
      closeModal();
      tab = "packets";
      render();
    }

    window.openPacketShare = (packetId) => {
      const packet = packets.find((p) => p.id === packetId);
      if (packet) shareUi.open({ id: packet.id, title: packet.title });
    };

    window.openPacketView = (packetId) => {
      const packet = packets.find((p) => p.id === packetId);
      const steps = sortByOrder(packetSteps.filter((s) => s.packet_id === packetId));
      openModal(`
        <div class="printable">
          <div class="packet">
            <h2>${esc(packet.title)}</h2>
            ${packet.safe_notes ? `<p>${esc(packet.safe_notes)}</p>` : ""}
            <ol>${steps.map((s) => `<li><strong>${esc(s.title_snapshot)}</strong>${s.details_snapshot ? `<br>${esc(s.details_snapshot)}` : ""}</li>`).join("")}</ol>
            ${packet.include_contacts ? `<p><strong>Contacts:</strong> Use the household contact list provided by the adult.</p>` : ""}
            ${packet.include_health_notes ? `<p><strong>Health notes:</strong> Review only the health information the adult has separately provided.</p>` : ""}
            ${packet.include_documents ? `<p><strong>Documents:</strong> Use only the documents the adult selected for this visit.</p>` : ""}
          </div>
        </div>
        <div class="modal-actions no-print"><button onclick="closeModal()">Close</button><button class="primary" onclick="window.print()">Print</button></div>
      `);
    };

    async function firstLoad() {
      try {
        await loadMembers();
        await loadData();
        loadFailed = false;
      } catch {
        // A failed load must not leave the frame empty: draw the shell and say
        // the routines could not be read, rather than showing them as none.
        loadFailed = true;
      }
      render();
    }
    document.addEventListener("click", (e) => {
      if (e.target.closest('[data-testid="load-retry"]')) firstLoad();
    });
    await firstLoad();
  </script>
</body>
</html>
